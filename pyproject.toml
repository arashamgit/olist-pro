[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-pro"
version = "1.0.0"
description = "Sales and customer-behaviour analysis of the Olist Brazilian e-commerce dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.1.0",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "pyarrow==22.0.0",
    "reportlab==5.1.0",
    "arabic-reshaper==3.0.0",
    "python-bidi==0.6.6",
]

[project.optional-dependencies]
notebooks = ["nbformat==5.11.1", "nbclient==0.11.0", "nbconvert==7.16.6", "ipykernel==7.1.0"]
dev = ["pytest==9.1.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
